name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # 실제 PostgreSQL 로 마이그레이션과 DB 함수를 검사한다. 러너에 PostgreSQL 이 없으면 깐다
      - name: PostgreSQL 준비
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin
      - run: npm run test:db
      - run: npx next build
        env:
          # 빌드는 환경변수 없이도 돈다 (런타임에 미설정이면 안내 화면). 있으면 그대로 쓴다.
          NEXT_PUBLIC_SITE_URL: https://danchu.kr
